                <div style="display:flex;flex-direction:column;gap:8px;"><span style="font-size:14px;font-weight:600;color:{{ lblDurColor }};">{{ lblDur }}</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;"><sc-for list="{{ durOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.onClick }}" aria-pressed="{{ o.on }}" style="height:48px;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};border:{{ o.border }};">{{ o.label }}</button></sc-for></div><sc-if value="{{ showDurStepper }}"><div role="group" aria-label="회의 길이 직접 설정" style="display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 4px;border:1px solid #E2E8F0;border-radius:12px;background:#FFFFFF;"><button onClick="{{ onDurMinus }}" aria-label="15분 줄이기" aria-disabled="{{ durMinusDisabled }}" style="width:44px;height:44px;border:none;background:transparent;border-radius:12px;font-size:24px;color:#18243A;cursor:pointer;">−</button><span aria-live="polite" style="font-size:16px;font-weight:600;">{{ durValLabel }}</span><button onClick="{{ onDurPlus }}" aria-label="15분 늘리기" aria-disabled="{{ durPlusDisabled }}" style="width:44px;height:44px;border:none;background:transparent;border-radius:12px;font-size:24px;color:#18243A;cursor:pointer;">+</button></div></sc-if></div>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span style="font-size:14px;font-weight:600;color:{{ lblDateColor }};">{{ lblDate }}</span></div>
                  <div style="display:flex;align-items:center;gap:4px;">
                    <button onClick="{{ onPrevWeek }}" aria-label="이전 주" aria-disabled="{{ prevWeekDisabled }}" style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ prevWeekColor }};border-radius:12px;">{{ I.back }}</button>
                    <span style="flex:1;text-align:center;font-size:16px;font-weight:600;">{{ weekLabel }}</span>
                    <button onClick="{{ onNextWeek }}" aria-label="다음 주" aria-disabled="{{ nextWeekDisabled }}" style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ nextWeekColor }};border-radius:12px;">{{ I.next }}</button>
                    <button onClick="{{ onToggleCalView }}" aria-pressed="{{ calView }}" aria-label="달력으로 보기" style="width:44px;height:44px;border-radius:12px;border:1px solid #E2E8F0;background:{{ calViewBg }};color:#18243A;cursor:pointer;display:flex;align-items:center;justify-content:center;">{{ I.calendar }}</button>
                  </div>
                  <sc-if value="{{ showWeekStrip }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:8px;"><sc-for list="{{ weekDays }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.onClick }}" aria-pressed="{{ o.on }}" aria-label="{{ o.aria }}" style="flex:1;height:60px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{ o.bg }};color:{{ o.fg }};border:{{ o.border }};"><span style="font-size:18px;font-weight:600;">{{ o.day }}</span><span style="font-size:13px;font-weight:600;">{{ o.wd }}</span></button></sc-for></div></sc-if>
                  <sc-if value="{{ calView }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;flex-direction:column;gap:8px;border:1px solid #E2E8F0;border-radius:16px;padding:12px;">
                      <div style="text-align:center;font-size:16px;font-weight:600;">2026년 11월</div>
                      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;"><sc-for list="{{ calHead }}" as="h" hint-placeholder-count="7"><span style="text-align:center;font-size:14px;line-height:21px;color:#5B6B81;">{{ h.l }}</span></sc-for><sc-for list="{{ calCells }}" as="cc" hint-placeholder-count="35"><button onClick="{{ cc.onClick }}" aria-disabled="{{ cc.disabled }}" aria-label="{{ cc.aria }}" style="height:44px;border-radius:8px;border:none;font-size:16px;font-weight:600;cursor:pointer;background:{{ cc.bg }};color:{{ cc.fg }};">{{ cc.l }}</button></sc-for></div>
                      <span style="font-size:14px;line-height:21px;color:#5B6B81;">평일 11월 17일–27일 중에서 고를 수 있어요 (데모 범위)</span>
                    </div>

                  <div style="display:flex;flex-direction:column;gap:2px;background:#F4F6FF;border-radius:12px;padding:12px 16px;"><span style="font-size:16px;font-weight:600;color:#2946B8;">{{ draftDateText }}</span><span style="font-size:14px;line-height:21px;color:#5B6B81;">{{ draftDateHint }}</span><sc-if value="{{ draftBasis }}"><span style="font-size:13px;line-height:20px;color:#5B6B81;">{{ draftBasis }}</span></sc-if></div>
                  <sc-if value="{{ showPrefDay }}">
                    <div style="display:flex;flex-direction:column;gap:8px;"><span style="font-size:14px;font-weight:600;color:{{ lblPrefDayColor }};">{{ lblPrefDay }}</span><div style="display:flex;gap:8px;flex-wrap:wrap;"><sc-for list="{{ prefDayOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.onClick }}" aria-pressed="{{ o.on }}" style="height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};border:{{ o.border }};">{{ o.label }}</button></sc-for></div><span style="font-size:14px;line-height:21px;color:#5B6B81;">기간 안에서 찾되, 선호 날짜를 조금 더 우선해요.</span></div>

                <div style="display:flex;flex-direction:column;gap:8px;"><span style="font-size:14px;font-weight:600;color:{{ lblPrefColor }};">{{ lblPref }}</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;"><sc-for list="{{ prefOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" aria-pressed="{{ o.on }}" style="height:48px;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};border:{{ o.border }};">{{ o.label }}</button></sc-for></div><span style="font-size:14px;line-height:21px;color:#5B6B81;">오전 9–12시 · 오후 13–18시</span></div>
                <div style="display:flex;flex-direction:column;gap:8px;"><span style="font-size:14px;font-weight:600;color:{{ lblModeColor }};">{{ lblMode }}</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;"><sc-for list="{{ attendOpts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.onClick }}" aria-pressed="{{ o.on }}" style="height:48px;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};border:{{ o.border }};">{{ o.label }}</button></sc-for></div></div>
                <sc-if value="{{ showDraftRecheck }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;font-size:14px;line-height:1.5;color:#925500;background:#FFF3DC;border-radius:12px;padding:12px 16px;"><span style="display:flex;padding-top:2px;">{{ I.alert }}</span><span>{{ draftRecheckText }}</span></div></sc-if>
                <sc-if value="{{ showDraftInvalid }}" hint-placeholder-val="{{ false }}"><div style="font-size:14px;line-height:1.5;color:#18243A;background:#EDF1F7;border-radius:12px;padding:12px 16px;">기간·길이·참석 방식을 바꾸면 기존 추천은 더 이상 유효하지 않아요. 저장 후 다시 계산해요.</div></sc-if>

              <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border-top:1px solid #E2E8F0;"><sc-if value="{{ showNoChange }}"><span style="text-align:center;font-size:13px;line-height:20px;color:#5B6B81;">변경된 내용이 없어요</span></sc-if><div style="display:flex;gap:8px;align-items:center;">
                <button onClick="{{ onResetDraft }}" aria-disabled="{{ saveDisabled }}" style="height:56px;padding:0 16px;border:none;background:transparent;color:{{ undoColor }};font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">되돌리기</button>
                <button onClick="{{ onSaveEdit }}" aria-disabled="{{ saveDisabled }}" style="flex:1;height:56px;border-radius:14px;border:none;background:{{ saveBg }};color:{{ saveFg }};font-size:16px;font-weight:600;line-height:24px;cursor:pointer;">{{ saveLabel }}</button>

                <div style="margin-top:24px;display:flex;flex-direction:column;gap:8px;">
                  <button onClick="{{ onSaveEdit }}" style="width:100%;height:52px;border-radius:14px;border:none;background:#3654D4;color:#FFFFFF;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;">저장하고 닫기</button>
                  <button onClick="{{ onDiscardEdit }}" style="width:100%;height:48px;border-radius:14px;border:1px solid #E2E8F0;background:#FFFFFF;color:#18243A;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;">저장하지 않고 닫기</button>
                  <button onClick="{{ onKeepEdit }}" style="width:100%;height:48px;border:none;background:transparent;color:#2946B8;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;">계속 수정하기</button>

      <div style="background:#FFFFFF;border:2px solid #A9BCFF;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;"><div style="display:flex;flex-direction:column;gap:4px;"><div style="font-size:24px;line-height:32px;font-weight:700;">v6.0 · 홈 · 조건 확인 · 추천 화면 개선</div><div style="font-size:16px;line-height:24px;color:#5B6B81;">홈에 예시·이전 회의 재사용·작성 중 이어하기를 더하고, 조건 확인 카드를 컴팩트하게 줄였어요. 추천 카드는 상태 칩과 근거 바텀시트로 정리했어요.</div></div><div style="display:grid;grid-template-columns:170px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">화면</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">정리한 내용</div><div style="padding:12px;border-top:1px solid #E2E8F0;">홈 (24~26)</div><div style="padding:12px;border-top:1px solid #E2E8F0;">입력창은 하단 한 곳, 예시를 누르면 입력창에 채움 · ‘이전 회의로 새 일정 잡기’는 이전 회의가 있을 때만 · 이전 회의를 고르면 원본은 두고 새 초안 생성 · 날짜·시간대·참석 가능 여부는 새로 확인 · ‘작성 중’ 카드는 저장된 초안이 있을 때만</div><div style="padding:12px;border-top:1px solid #E2E8F0;">조건 확인</div><div style="padding:12px;border-top:1px solid #E2E8F0;">제목 · 날짜/시간 2열 블록 · 방식 · 참석자 순 · 주요 CTA ‘참석자 선택하기’(미정이 있으면 ‘조건 수정하기’) · 보조 버튼 ‘직접 입력’을 누르면 입력창이 열림 · 요청한 참석자 조건과 실제 선택은 분리</div><div style="padding:12px;border-top:1px solid #E2E8F0;">추천 시간</div><div style="padding:12px;border-top:1px solid #E2E8F0;">추천 카드 · 상태 칩(텍스트만) · 추천 이유 바텀시트 · 세로형 후보 비교 · 선택 후 ‘이 시간으로 계속’</div><div style="padding:12px;border-top:1px solid #E2E8F0;">공통</div><div style="padding:12px;border-top:1px solid #E2E8F0;">챗 헤더 NODI 로고 · 한 줄 그라데이션 진행 바 · 글자 스케일 13·14·16·18·24·28 · 간격 4px 격자</div></div></div>
      <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;"><div style="display:flex;flex-direction:column;gap:4px;"><div style="font-size:22px;line-height:30px;font-weight:600;">v5.2 · 토스 레퍼런스로 디자인 품질 개선</div><div style="font-size:16px;line-height:24px;color:#5B6B81;">유아이볼의 토스 화면에서 ‘특징’만 가져왔어요(토스 로고·아이콘·에셋·화면 구성은 쓰지 않음). 3D 일러스트는 NODI 블루로 새로 그린 오리지널 SVG예요.</div></div><div style="display:flex;gap:16px;align-items:flex-end;padding:8px 0;"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNDAgMjQwIiB3aWR0aD0iMjQwIiBoZWlnaHQ9IjI0MCI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImZhY2UiIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNGRkZGRkYiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiNFNkVDRkYiLz48L2xpbmVhckdyYWRpZW50PgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJzaWRlIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjQjlDN0Y1Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjOEZBM0VBIi8+PC9saW5lYXJHcmFkaWVudD4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iaGVhZCIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzZGOEJGRiIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzM2NTRENCIvPjwvbGluZWFyR3JhZGllbnQ+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9InJpbmciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIwIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiM5QUE2QkQiLz48c3RvcCBvZmZzZXQ9Ii41IiBzdG9wLWNvbG9yPSIjRjRGNkZCIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjN0U4QUEzIi8+PC9saW5lYXJHcmFkaWVudD4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ib2siIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiMzQ0NCOEUiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMxMTkwNjIiLz48L2xpbmVhckdyYWRpZW50PgogICAgPHJhZGlhbEdyYWRpZW50IGlkPSJva0hpIiBjeD0iLjM1IiBjeT0iLjI1IiByPSIuNiI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjRkZGRkZGIiBzdG9wLW9wYWNpdHk9Ii41NSIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI0ZGRkZGRiIgc3RvcC1vcGFjaXR5PSIwIi8+PC9yYWRpYW       <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;"><div style="display:flex;flex-direction:column;gap:4px;"><div style="font-size:22px;line-height:30px;font-weight:600;">v5.0 · 최종 UX/UI 개선 및 구현 프롬프트 v2.0 반영</div><div style="font-size:16px;line-height:24px;color:#5B6B81;">선택형 + 자유 입력 하이브리드, 07·08 구조 재설계, 아이콘보다 정보 위계. 12번 3열 통계는 직전 요청(가능 응답 / 충돌 없음 / 참석 어려움)을 유지했어요.</div></div><div style="display:grid;grid-template-columns:120px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">영역</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">변경</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">시작 (P0)</div><div style="padding:12px;border-top:1px solid #E2E8F0;">첫 메시지 ‘안녕하세요! 어떤 회의를 잡아드릴까요? 아래에서 선택하거나 편하게 말씀해 주세요.’ + 2열 선택(팀 회의 · 1:1 미팅 · 디자인 리뷰 · 다른 회의 직접 입력) → 언제(이번 주 · 다음 주 · 날짜 직접 선택 · 직접 입력) → 길이(30 · 60 · 90분 · 직접 입력) → 조건 확인 카드. 자유 입력은 언제든 가능하고, 이미 고른 값은 다시 묻지 않고 합쳐요. 생성 흐름 중에는 하단 탭 숨김</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">조건 확인</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘말씀하신 내용을 정리했어요. 필요한 항목만 수정할 수 있어요.’, 행 전체를 눌러 수정 + 작은 chevron(행마다 연필 제거), 선택으로 정한 값은 배지 없이 표시, CTA ‘참석자 선택하기’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">일정 필수</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘전원 일정 조건 충족’, CTA ‘완료 · 일정 필수 N명’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">조율 현황</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘2/3명 응답 완료’ + ‘응답 완료 2명 · 대기 1명’, 마감 행 아이콘 제거</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">추천</div><div style="padding:12px;border-top:1px solid #E2E8F0;">비교 보기는 4개 항목(일정 필수 · 참석 가능 응답 · 캘린더 충돌 없음 · 참석 어려움)으로 제한, 핵심 시간 22/600</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">07 최종 검토</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘이 일정으로 회의를 저장할까요?’ · ‘저장 후 회의 상세에서 내용을 확인할 수 있어요.’, 확정 후 처리 행 아이콘 제거(SettingRow: 제목+설명 | 상태·토글), NODI 저장 ‘자동’ 배지, 연결 기능이 없는 ‘캘린더 연결하기’ 행 제거 → 하단 한 줄 ‘캘린더에는 자동 반영되지 않아요.’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">08 완료</div><div style="padding:12px;border-top:1px solid #E2E8F0;">체크 아이콘 하나 + ‘회의가 저장됐어요’ · 회의명·참석자 · 18px 일정, ‘후속 처리 현황’(ResponseStatusRow: NODI 회의 저장 완료 / 캘린더 반영 미연결 / 알림 (데모) n건 실패, 아이콘 없음), 실패가 있을 때만 ‘확인이 필요한 항목 N건’ + 재처리 버튼(처리 중 표시), 미연결은 오류 건수에 넣지 않음</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">상세 · 응답</div><div style="padding:12px;border-top:1px solid #E2E8F0;">상태 문구 ‘알림 · 데모 처리’처럼 짧게, 응답 옵션 ‘가능 / 조정하면 가능 / 불가’, ‘제출 후에도 마감 전까지 수정할 수 있어요’, 재조율 CTA ‘새 일정으로 변경 확정’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">공통</div><div style="padding:12px;border-top:1px solid #E2E8F0;">제목·강조 굵기 Semibold(600), 배지 Medium(500), 참석자 시트 섹션 제목의 장식 아이콘 제거, 상세 외부 처리 행 아이콘 제거</div></div></div>

      <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;"><div style="display:flex;flex-direction:column;gap:4px;"><div style="font-size:22px;line-height:30px;font-weight:600;">v4.4 · 최종 UX/UI 개선 명세서 반영</div><div style="font-size:16px;line-height:24px;color:#5B6B81;">Soft Clarity — 한 화면에 주요 행동 하나, 결론과 결정 사항을 먼저, 상태와 선택을 색으로 구분. v4.3과 값이 다른 부분은 최종 명세서를 따랐어요.</div></div><div style="display:grid;grid-template-columns:150px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">토큰</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">v4.4 값</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Color</div><div style="padding:12px;border-top:1px solid #E2E8F0;">Primary #3654D4 · 본문 #18243A · 보조 #5B6B81(제안 #64748B는 #F5F7FB 위 4.4:1이라 조정) · 테두리 #E2E8F0 · 상태 글자는 연한 배경 위 대비 확보를 위해 #137B57 / #925500 / #B52E3A 유지(제안 #13845F·#A16207·#C93646은 배지 배경 위 4.2–4.5:1) · 위험 버튼 배경 #C93646 · 비활성 #E9EDF3 위 #5B6B81</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Typography</div><div style="padding:12px;border-top:1px solid #E2E8F0;">화면 제목 24/700 · 핵심 시간·날짜 26–28/700 · 카드 제목 16–18/600 · 본문 15–16/400 · 보조 13–14/400 · 배지 13/600 · 버튼 16/600</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Radius</div><div style="padding:12px;border-top:1px solid #E2E8F0;">카드 16 · 바텀시트 상단 24 · 입력 12 · 버튼 14 · 배지 pill · 테두리 1px</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Button</div><div style="padding:12px;border-top:1px solid #E2E8F0;">주요 56 · 보조 48 · 아이콘 44×44 · 화면당 주요 CTA 1개, 보조 행동은 아웃라인·텍스트</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">State</div><div style="padding:12px;border-top:1px solid #E2E8F0;">파랑=선택·CTA·현재 단계, 초록=검증된 충족·성공, 노랑=대기·확인 필요, 빨강=충돌·오류, 회색=미선택·미확인. 후보 선택은 파란 테두리 + 라디오</div></div><div style="font-size:16px;line-height:24px;font-weight:600;padding-top:8px;">화면별 변경</div><div style="display:grid;grid-template-columns:120px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">화면</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">변경</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">01</div><div style="padding:12px;border-top:1px solid #E2E8F0;">제목 ‘회의 조건을 확인해 주세요’ + 설명 한 줄, CTA ‘조건 확인하고 참석자 선택’, 조건 수정은 보조 버튼</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">02</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘하루 선택 / 기간 선택’, 회의 길이 30·60·90분 + 직접 설정(15분 단위 −/+), 저장 버튼은 변경 시에만 활성 + ‘변경된 내용이 없어요’ 보조 설명</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">03</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘선택한 참석자 N명 · 접기/펼치기’ 요약, 동명이인 배지 제거(이름 · 팀 + 이메일로 구분), CTA ‘N명 선택하고 다음’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">04</div><div style="padding:12px;border-top:1px solid #E2E8F0;">정책을 간결한 라디오로, 선택한 정책 설명만 노출, ‘전원 일정 조건 충족’, CTA ‘일정 필수 1명 설정 완료’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">05</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘2/3명 응답 제출’ 강조, 요약은 응답 완료·응답 대기·재확인 필요만</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">06</div><div style="padding:12px;border-top:1px solid #E2E8F0;">시간 중심 카드: NODI 추천(1순위만) · 필수 일정 조건 배지 · 날짜 · 28px 시간 · ‘가능 응답 n명 · 캘린더 일정 없음 n명’ · 근거 1줄 · ‘추천 근거 자세히 보기’, CTA ‘선택한 시간 검토’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">07–08</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘이 일정으로 회의를 확정할까요?’ · ‘NODI에 회의가 저장됐어요’ + ‘외부 처리 현황’ 보조 섹션</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">09–10</div><div style="padding:12px;border-top:1px solid #E2E8F0;">상태 용어 통일(참석자 조율 중 · 조건 작성 중 · 데모 처리 · 조회 불가), 상세는 참석자 → 행동 → 외부 처리 상태 순, 정상 상태는 한 줄</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">11–13</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘새 시간을 찾아볼까요?’ / ‘새 시간 찾기’ / ‘취소’, ‘선택한 새 시간 검토’, 재응답 필요 시 ‘새 일정으로 변경하고 재확인 요청’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">v4.5 보완</div><div style="padding:12px;border-top:1px solid #E2E8F0;">12번 필수 일정 조건 미충족 후보를 기본 목록에서 빼고 ‘필수 조건 미충족 후보 N개 보기’ 접힘 영역으로 이동(선택 불가, 데모 후보 1개 추가) · 재조율 후보 시간 28px · 변경 처리 단계에 ‘(데모 · 실제 발송 없음)’ 표기 · 조건 확인 단계에서는 하단 탭바를 숨겨 CTA가 가려지지 않게 · 재확인 요청 카드에도 마감일 표시 · 내 회의 상태 배지 축소</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">v4.6 정렬</div><div style="padding:12px;border-top:1px solid #E2E8F0;">리스트 공통: 왼쪽 요소 고정 너비 + 상단 정렬, 텍스트는 한 기준선, 긴 제목·이름은 말줄임, 아바타 이니셜 2자 · 09 날짜 박스 54px, 배지 우측 상단 ‘확정/재조율/조율 중/종료/취소’, 알림 문구는 아이콘 없이 같은 기준선 · 10 아바타 44px, 응답 상태 배지를 먼저, 데모 알림은 13px 보조 문구 · 12 통계 숫자 Navy 통일, ‘가능 응답 / 충돌 없음 / 참석 어려움’ 동일 너비 3열, 집계 기준 설명(한 사람은 한 항목에만 집계, 확인 불가 제외)과 응답·충돌 안내를 통계 아래 별도 블록으로 · 15 선택 상태는 채움 색만(체크 아이콘 제거)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">14–16</div><div style="padding:12px;border-top:1px solid #E2E8F0;">변경 요청 CTA ‘변경된 후보 확인하기’, 응답 옵션 ‘가능 / 조정 가능 / 불가’, 유지되는 응답은 접기, 변경 후 ‘변경된 후보 응답 제출’</div></div></div>

      <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;"><div style="display:flex;flex-direction:column;gap:4px;"><div style="font-size:22px;line-height:30px;font-weight:600;">v4.3 · 모바일 UX/UI 개선 명세서 v2.0 반영</div><div style="font-size:16px;line-height:24px;color:#5B6B81;">명세서 토큰을 기준으로 v4.2 값을 대체했어요. 대비 기준(4.5:1)을 못 넘는 제안 색 2개는 가장 가까운 통과 값으로 바꿨어요.</div></div><div style="display:grid;grid-template-columns:150px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">토큰</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">v4.3 값</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Color</div><div style="padding:12px;border-top:1px solid #E2E8F0;">Primary #3654D4 · Soft #E9EEFF · 텍스트 #18243A / #5B6B81 / #5B6B81(제안 #718098은 흰 배경 4.0:1이라 조정) · 테두리 #E2E8F0 · 구분선 #E2E8F0 · Success #137B57 · Warning #925500 · Danger #B52E3A · 비활성 #E9EDF3 위 #5B6B81(제안 #65748D는 3.7:1이라 조정)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Typography</div><div style="padding:12px;border-top:1px solid #E2E8F0;">페이지 제목·카드 핵심 시간 24/700/32 · 시트·모달 제목 22/700/30 · 섹션·카드 제목 18/650 · 본문 16/400/24 · 보조 14/400/21 · 주요 버튼 16/650. 캡션은 기존 원칙대로 13px 이상 유지(명세 12px 미적용)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Spacing</div><div style="padding:12px;border-top:1px solid #E2E8F0;">4px 단위 · 화면 좌우 20 · 카드 패딩 20 · 하단 CTA 영역 위 16 · 좌우 20 · 아래 34(safe area)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Radius</div><div style="padding:12px;border-top:1px solid #E2E8F0;">입력 14 · 버튼 16 · 카드 20 · 바텀시트 상단 28 · 배지·칩 pill</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Button</div><div style="padding:12px;border-top:1px solid #E2E8F0;">주요 56 · 보조 52 · 텍스트 16/650 · 비활성 시 사유를 버튼 문구로 표시(예: 후보를 선택해 주세요)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Card</div><div style="padding:12px;border-top:1px solid #E2E8F0;">기본은 #E2E8F0 1px 테두리, 그림자 없음 · 선택 시 2px #3654D4 + #F7F9FF · 그림자는 하단 탭바에만</div></div><div style="font-size:16px;line-height:24px;font-weight:600;padding-top:8px;">화면별 변경</div><div style="display:grid;grid-template-columns:120px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">화면</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">변경</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">01 조건 확인</div><div style="padding:12px;border-top:1px solid #E2E8F0;">제목 ‘회의 조건을 이렇게 이해했어요’, AI 해석 안내는 카드 상단에 한 번만, 행마다 수정 버튼, 날짜는 ‘입력 · 기준일’로 분리, CTA ‘조건 확인하고 계속’ / 미정이 있으면 ‘조건 수정하기’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">02 조건 수정</div><div style="padding:12px;border-top:1px solid #E2E8F0;">회의 길이 30·45·60·90·120분 한 줄, 시간대 설명 ‘오전 9–12시 · 오후 13–18시’, 저장 ‘변경사항 저장’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">03 참석자</div><div style="padding:12px;border-top:1px solid #E2E8F0;">선택 4명 이상이면 ‘선택된 참석자 N명 보기’로 접기, 동명이인은 ‘이름 · 팀’, 선택 행 Primary Soft</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">04 일정 필수</div><div style="padding:12px;border-top:1px solid #E2E8F0;">정책 문구 정리(‘전원 일정 조건 충족’), 안내 ‘일정 필수는 참석 수락을 의미하지 않아요.’, 행 높이 68</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">05 조율 현황</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘2/3명 응답 제출’, ‘제출 완료’, ‘조정하면 가능’ 계산 기준 명시, 리마인드 데모 문구</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">06 추천</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘필수 조건 충족/확인 필요’ 배지, 추천 근거는 ‘추천 근거 보기’로 접기, 적합도 점수 표시 제거(1.2), 선택 카드 2px + #F7F9FF, CTA ‘이 시간으로 계속’</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">07 최종 검토</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘확정 후 처리’ 섹션, CTA 위 ‘확정하면 NODI에 저장돼요’ + 외부 처리 한 줄</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">08 완료</div><div style="padding:12px;border-top:1px solid #E2E8F0;">경고 배너 대신 ‘외부 작업 N건 확인 필요’ 한 줄</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">09 내 회의</div><div style="padding:12px;border-top:1px solid #E2E8F0;">경고 ‘알림 1건 확인 필요’처럼 짧게</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">10 상세</div><div style="padding:12px;border-top:1px solid #E2E8F0;">새 시간 찾기 · 회의 정보 수정 · 회의 취소(빨간 텍스트 버튼 + 확인 모달, 취소 알림은 데모)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">11–13 재조율</div><div style="padding:12px;border-top:1px solid #E2E8F0;">보조 버튼 ‘기존 회의 유지’, 후보 위 ‘기존 응답은 새 후보에 그대로 적용되지 않을 수 있어요.’, 새 응답 필요 이름 접기/펼치기</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">14–16 요청</div><div style="padding:12px;border-top:1px solid #E2E8F0;">카드마다 ‘다시 확인하기 / 가능 시간 응답하기’, 응답 선택 시 체크 표시, ‘임시 저장됨 · 아직 제출되지 않음’, ‘조정 메모 (선택)’, ‘새 후보 1개에 대한 응답이 필요해요.’, 탭 배지 99+</div></div></div>

nt-weight:600;">규칙</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Typography</div><div style="padding:12px;border-top:1px solid #E2E8F0;">13 캡션 · 14 보조 · 16 본문/버튼 · 18 상단 바/카드 제목 · 22 화면·시트 제목 · 24 추천 시각. 굵기 400/500/600만(700·800 제거), 위계는 크기와 색으로. 음수 자간 제거, 숫자 tabular-nums</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Spacing</div><div style="padding:12px;border-top:1px solid #E2E8F0;">4px 그리드: 4 · 8 · 12 · 16 · 20 · 24 · 32. 화면 좌우 20, 카드 패딩 20, 그룹 내부 8, 그룹 사이 12–16 (홈 인디케이터 34만 예외)</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Color</div><div style="padding:12px;border-top:1px solid #E2E8F0;">브랜드 #3654D4(주요 행동·선택), 링크/강조 텍스트 #2946B8, 텍스트 3단계 #18243A · #5B6B81 · #5B6B81, 표면 #F5F7FB / #FFFFFF, 헤어라인 rgb(24 36 58 / 8%). 보라 AI 색(#5940A8 계열) 제거. 상태색은 의미가 있을 때만</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Radius</div><div style="padding:12px;border-top:1px solid #E2E8F0;">배지 6–8 · 버튼·입력·칩 12 · 카드 16 · 시트 상단 24 · 원형 아바타/스위치는 높이의 절반</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Button</div><div style="padding:12px;border-top:1px solid #E2E8F0;">Primary 56(채움 #3654D4) · Secondary 48(흰색+테두리 #E2E8F0) · Small 44 · Text(링크형). 세그먼트·칩·토글도 44 이상</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">States</div><div style="padding:12px;border-top:1px solid #E2E8F0;">Hover 밝기 −3% · Press scale .98 · Focus 2px #3654D4 링 + 2px 간격 · Disabled aria-disabled + #E9EDF3/#5B6B81 + not-allowed · Loading 스피너 + 라벨 유지. 이징 cubic-bezier(.22,1,.36,1) 하나, 120–180ms. reduce-motion 존중</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Modal · Sheet</div><div style="padding:12px;border-top:1px solid #E2E8F0;">하단 고정 영역은 그라데이션 대신 단색 #F5F7FB + 상단 헤어라인. 시트 제목 22/30, 버튼 영역 위 12, 아래 34. 확인 모달은 아이콘 → 제목 → 핵심 → 보조 → 버튼 순</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">Breakpoints</div><div style="padding:12px;border-top:1px solid #E2E8F0;">시안은 390pt 고정 기기 프레임. 구현 시 기준: 360 미만 Compact(좌우 16) · 360–599 Base(좌우 20) · 600 이상 콘텐츠 최대 폭 560 중앙 정렬</div></div><div style="font-size:16px;line-height:24px;font-weight:600;padding-top:8px;">변경 내용</div><div style="display:grid;grid-template-columns:120px minmax(0,1fr);font-size:14px;line-height:21px;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;"><div style="padding:12px;background:#F5F7FB;font-weight:600;">영역</div><div style="padding:12px;background:#F5F7FB;font-weight:600;">변경</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">버그</div><div style="padding:12px;border-top:1px solid #E2E8F0;">최종 검토 하단 영역이 반투명이라 확정 범위 문구와 알림 스위치가 겹치던 문제 → 단색 하단 + 스크롤 여백 248. 회의 상세 ‘새 시간 찾기’가 28px로 눌리던 문제 → 버튼 flex-shrink 0</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">강조 정리</div><div style="padding:12px;border-top:1px solid #E2E8F0;">‘AI 해석’ 배지 채움 제거(정보는 유지, 회색 텍스트), 추천 근거의 보라 박스·반짝이 제거, 통계 타일(진행 현황·추천·재조율) 색 박스 → 헤어라인 구분 숫자</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">값 정리</div><div style="padding:12px;border-top:1px solid #E2E8F0;">모서리 값 25종 → 6종, 간격 3·5·6·10·14·18 → 4px 그리드, 글자 크기 12·15·17 제거, 하단 그라데이션 7곳 제거</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">텍스트 전용</div><div style="padding:12px;border-top:1px solid #E2E8F0;">배지·상단 탭·CTA 버튼은 아이콘 없이 문구만. 하단 내비게이션은 아이콘 + 문구 유지. 참석자 시트 상단의 1·2단계 표시는 제거(제목과 뒤로 버튼으로 단계 구분). 아이콘 전용 버튼(뒤로·닫기·정보·보내기), 칩 삭제 ×, 로딩 스피너, 설정 행 아이콘은 유지</div><div style="padding:12px;border-top:1px solid #E2E8F0;font-weight:600;">접근성</div><div style="padding:12px;border-top:1px solid #E2E8F0;">44px 미만 터치 영역 24개 → 0개, 13px 미만 글자 33개 → 0개, 초록 배지 대비 4.2:1 → 5.6:1, 입력창 전체 높이를 탭 영역으로</div></div></div>
