  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:0;right:0;top:47px;bottom:0;overflow-y:auto;padding:20px 16px 32px;box-sizing:border-box">
      <div style="font-size:13px;line-height:18px;color:#666B73">올리브영 오늘드림 UX 개선 · 비공식 포트폴리오 시안</div>
      <div style="font-size:24px;line-height:32px;font-weight:700;margin-top:6px">품절에서 끝나지 않는<br>구매 경험</div>
      <div style="font-size:14px;line-height:20px;color:#666B73;margin-top:8px">시나리오를 골라 직접 조작해 보세요. 재고 조회와 결제는 모두 시뮬레이션이에요.</div>
      <div style="margin-top:16px;font-size:13px;line-height:18px;color:#666B73">옵션 선택 방식 비교</div><div style="display:flex;gap:8px;margin-top:6px"><button onClick="{{modeA}}" style="{{segModeA}}">A안 · 하단 CTA</button><button onClick="{{modeB}}" style="{{segModeB}}">절충안 · 바로 선택</button></div>
      <button onClick="{{startA}}" style="display:block;width:100%;text-align:left;margin-top:20px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow A · P0</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">오늘드림 품절 → 일반배송 구매</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 일반배송 재고를 확인하고, 일반배송으로 구매해 보세요.</span></button>
      <button onClick="{{startB}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow B · P0</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">오늘드림 품절 → 매장 픽업 구매</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 픽업 주문이 가능한 매장을 찾아 픽업으로 구매해 보세요. 매장마다 주문 가능 여부가 달라요.</span></button>
      <button onClick="{{startC}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow C · 예외 상태</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">일반배송 조회 실패 → 재시도</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 재고 조회가 실패해요. 다시 확인해서 구매를 이어가 보세요.</span></button>
      <button onClick="{{startD}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow D · 예외 상태</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">확인한 방법 모두 불가 → 재입고 알림</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 일반배송과 픽업 모두 주문할 수 없을 때 재입고 알림을 신청해 보세요.</span></button>
      <button onClick="{{startE}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow E · 예외 상태</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">주문 직전 픽업 재고 변동</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 픽업으로 구매를 진행하다가 결제 직전에 상태가 바뀌어요. 안내를 읽고 다른 방법으로 이어가 보세요.</span></button>
      <button onClick="{{startF}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow F · P2</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">상세 하단 수령 방법 패널</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 패널을 펼쳐 수령 방법을 바꾸고, 접은 뒤에도 선택이 유지되는지 확인해 보세요.</span></button>
      <button onClick="{{startG}}" style="display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border:1px solid #DCDFE3;border-radius:8px;background:#FFFFFF;font-family:inherit;color:#131518;letter-spacing:-0.3px"><span style="display:block;font-size:13px;line-height:18px;color:#C72764;font-weight:600">Flow G · P1 / P2</span><span style="display:block;font-size:17px;line-height:24px;font-weight:700;margin-top:4px">무료배송 기준 미달 → 배송비 비교</span><span style="display:block;font-size:14px;line-height:20px;color:#666B73;margin-top:4px">과업: 10,000원 주문에서 가장 저렴한 배송 시간대를 고르고, 혜택과 최종 결제금액을 확인해 보세요.</span></button>

  <sc-if value="{{isStore}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:47px;height:48px;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;text-align:center;border-bottom:1px solid #EEEFF1;background:#FFFFFF"><button aria-label="뒤로" onClick="{{storeBack}}" style="width:44px;height:44px;margin-left:6px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#131518" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4.5M10.5 5.5L4 12l6.5 6.5"></path></svg></button><span style="font-size:18px;font-weight:600">픽업 매장 선택</span><span></span></div>

      <div style="font-size:13px;line-height:18px;color:#666B73">{{productName}} · 수량 1개</div>

      <sc-if value="{{hasStores}}"><div style="font-size:13px;line-height:18px;color:#666B73;margin:10px 0 2px">가까운 순 · 위치 권한 없이 지역명이나 매장명으로 검색할 수 있어요</div></sc-if>

    <sc-if value="{{notHome}}" hint-placeholder-val="{{ false }}"><button onClick="{{restart}}" style="height:32px;padding:0 12px;border:1px solid #DCDFE3;border-radius:16px;background:#FFFFFF;font-size:13px;color:#3A3D42;font-family:inherit">{{restartLabel}}</button></sc-if>
    <span style="margin-left:auto;font-size:13px;color:#666B73">{{flowLabel}}</span>
  </div>
</div>
</template>
<script src="./app.js"></script>
</body>
</html>
