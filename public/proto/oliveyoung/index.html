<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>올리브영 오늘드림 품절 UX 프로토타입</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="phone-shell" aria-label="올리브영 오늘드림 클릭형 프로토타입">
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">3:19</span>
          <span class="status-icons">▮▮▮ ◔ ▰</span>
        </div>

        <header class="app-header">
          <button class="icon-button" id="appBackButton" type="button" aria-label="이전">←</button>
          <strong id="appHeaderTitle">상품 상세</strong>
          <div class="header-actions" aria-hidden="true">
            <span>⌕</span>
            <span>⌂</span>
            <span>□</span>
          </div>
        </header>

        <div class="product-page" aria-hidden="true">
          <div class="campaign-visual">
            <img src="./public/assets/product-01.png" alt="" />
            <div>
              <span>15년 연속 1위</span>
              <strong>마데카소사이드<br />헤어 마스크팩</strong>
            </div>
          </div>
          <div class="product-copy">
            <span>메디힐</span>
            <strong>[11월 올영픽] 메디힐 에센셜 마스크팩 10+1매 기획</strong>
            <b>10,000원</b>
          </div>
        </div>

        <div class="page-scrim" aria-hidden="true"></div>

        <section class="bottom-sheet" aria-label="옵션 선택 바텀시트">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div id="screen" class="sheet-screen" aria-live="polite"></div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>

      <aside class="prototype-notes" aria-label="프로토타입 사용 안내">
        <span class="notes-kicker">TODAY DREAM UX</span>
        <h1>품절 뒤에도<br />구매를 이어갑니다</h1>
        <p>품절 옵션의 다른 수령 방법 확인, 픽업 매장 선택, 재입고 알림, 주문 연결까지 직접 눌러보세요.</p>
        <div class="notes-steps">
          <button type="button" data-jump="list"><b>옵션 목록</b><span>5가지 재고 CTA 비교</span></button>
          <button type="button" data-jump="methods"><b>수령 방법</b><span>일반배송과 픽업 비교</span></button>
          <button type="button" data-jump="pickup"><b>픽업 매장</b><span>재고와 준비 시간 확인</span></button>
          <button type="button" data-jump="restock"><b>재입고 알림</b><span>신청과 완료 상태</span></button>
        </div>
        <small>화면 내 재고와 예상 수령 시간은 프로토타입용 가상 데이터입니다.</small>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
